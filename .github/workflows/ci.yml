name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run unit and notebook checks
        env:
          BACKUP_HARD_EXECUTE_NOTEBOOK: "1"
        run: python -m unittest discover -s tests -v
      - name: Smoke-test command-line help
        shell: bash
        run: |
          python -m backup_hard.inventory --help
          python -m backup_hard.select_formats --help
          python -m backup_hard.copy_backup --help
          python -m backup_hard.verify_backup --help
