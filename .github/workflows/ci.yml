name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and quality tools
        run: python -m pip install -e ".[dev]"
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Lint and type-check
        run: |
          ruff check src tests
          mypy src/backup_hard
      - name: Run tests with coverage
        env:
          BACKUP_HARD_EXECUTE_NOTEBOOK: "1"
        run: python -m pytest --cov --cov-report=term-missing
      - name: Build distributions
        run: python -m build
      - name: Smoke-test command-line help
        shell: bash
        run: |
          python -m backup_hard.inventory --help
          python -m backup_hard.select_formats --help
          python -m backup_hard.copy_backup --help
          python -m backup_hard.verify_backup --help
          backup-hard --help
