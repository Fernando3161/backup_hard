[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backup-hard"
version = "0.8.0.dev0"
description = "Staged, resumable, verified filesystem backups"
requires-python = ">=3.9"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Fernando Peñaherrera", email = "fernandopenaherrera@gmail.com"}]
keywords = ["backup", "filesystem", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/Fernando3161/backup_hard"
Repository = "https://github.com/Fernando3161/backup_hard"
Issues = "https://github.com/Fernando3161/backup_hard/issues"

[project.optional-dependencies]
dev = ["build>=1", "mypy>=1.8", "pytest>=7", "pytest-cov>=4", "ruff>=0.5"]

[project.scripts]
backup-hard = "backup_hard.cli:main"
backup-inventory = "backup_hard.cli:inventory_main"
backup-select-formats = "backup_hard.cli:plan_main"
backup-copy = "backup_hard.cli:copy_main"
backup-verify = "backup_hard.cli:verify_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["backup_hard"]

[tool.mypy]
python_version = "3.9"
packages = ["backup_hard"]
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["backup_hard.android", "backup_hard.copy_backup", "backup_hard.inventory", "backup_hard.select_formats", "backup_hard.verify_backup"]
ignore_errors = true

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
